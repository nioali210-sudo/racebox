  <!-- tick marks -->
  <g stroke="white" stroke-width="8">
    <line x1="108" y1="300" x2="125" y2="285"/>
    <line x1="130" y1="220" x2="150" y2="230"/>
    <line x1="175" y1="160" x2="185" y2="182"/>
    <line x1="256" y1="135" x2="256" y2="160"/>
    <line x1="337" y1="160" x2="327" y2="182"/>
    <line x1="382" y1="220" x2="362" y2="230"/>
    <line x1="404" y1="300" x2="387" y2="285"/>
  </g>

  <!-- needle -->
  <line
    x1="256"
    y1="256"
    x2="150"
    y2="175"
    stroke="white"
    stroke-width="14"
    stroke-linecap="round"/>

  <circle
    cx="256"
    cy="256"
    r="22"
    fill="white"/>

  <!-- RB -->
  <text
    x="256"
    y="370"
