<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512">

  <rect width="512" height="512" rx="110" fill="#050505"/>

  <circle
    cx="256"
    cy="256"
    r="190"
    fill="#101010"
    stroke="#444"
